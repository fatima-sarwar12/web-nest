<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - WebNest</title>



    <script src="https://cdn.tailwindcss.com"></script>


    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.css"
          rel="stylesheet">

</head>


<body class="bg-gray-100">




    <nav class="bg-white shadow">

        <div class="max-w-6xl mx-auto px-4 py-4">

            <div class="flex flex-col md:flex-row md:justify-between md:items-center">


                <a href="../../index.html"
                   class="text-2xl font-bold text-blue-600">

                    WebNest

                </a>


                <div class="mt-4 md:mt-0 flex flex-wrap gap-4">

                    <a href="../../index.html"
                       class="hover:text-blue-600">

                        Home

                    </a>

                    <a href="about.html"
                       class="hover:text-blue-600">

                        About

                    </a>

                    <a href="contact.html"
                       class="hover:text-blue-600">

                        Contact

                    </a>

                    <a href="signup.html"
                       class="hover:text-blue-600">

                        Sign Up

                    </a>

                    <a href="signin.html"
                       class="text-blue-600 font-bold">

                        Sign In

                    </a>

                </div>

            </div>

        </div>

    </nav>



    

    <div class="max-w-md mx-auto mt-10 px-4">

        <div class="p-4 text-blue-800 bg-blue-100 rounded-lg">

            Welcome back! Please sign in to continue.

        </div>

    </div>



    

    <div class="max-w-md mx-auto my-6 px-4">


        <div class="bg-white shadow-lg rounded-lg p-8">


            <h1 class="text-3xl font-bold text-center mb-2">

                Welcome Back

            </h1>


            <p class="text-center text-gray-500 mb-8">

                Sign in to your WebNest account.

            </p>



           

            <form>


                

                <div class="mb-5">

                    <label class="block font-medium mb-2">

                        Email

                    </label>

                    <input type="email"
                           required
                           placeholder="Enter your email"
                           class="w-full p-3 border border-gray-300 rounded-lg">

                </div>



               

                <div class="mb-5">

                    <label class="block font-medium mb-2">

                        Password

                    </label>

                    <input type="password"
                           required
                           minlength="6"
                           placeholder="Enter your password"
                           class="w-full p-3 border border-gray-300 rounded-lg">

                </div>



               

                <div class="flex items-center justify-between mb-6">


                    <label class="flex items-center">

                        <input type="checkbox"
                               class="mr-2">

                        Remember me

                    </label>


                    <a href="#"
                       class="text-blue-600 text-sm">

                        Forgot Password?

                    </a>

                </div>



                

                <button type="submit"
                        class="w-full bg-blue-600 text-white
                               p-3 rounded-lg hover:bg-blue-700">

                    Sign In

                </button>


            </form>



        

            <p class="text-center mt-6 text-gray-600">

                Don't have an account?

                <a href="signup.html"
                   class="text-blue-600 font-bold">

                    Sign up.

                </a>

            </p>


        </div>

    </div>




    <footer class="bg-gray-900 text-white text-center py-8">

        <h3 class="text-xl font-bold">

            WebNest

        </h3>

        <p class="text-gray-400 mt-2">

            WebNest

        </p>

    </footer>




    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>


</body>

</html>
