<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - WebNest</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Flowbite CSS -->

    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.css"
          rel="stylesheet">

</head>


<body class="bg-gray-50">


    <!-- ================= NAVBAR ================= -->

    <nav class="bg-white shadow">

        <div class="max-w-6xl mx-auto px-4 py-4">

            <div class="flex flex-col md:flex-row md:justify-between md:items-center">


                <a href="../../index.html"
                   class="text-2xl font-bold text-blue-600">

                    WebNest

                </a>


                <div class="mt-4 md:mt-0 flex flex-wrap gap-4">

                    <a href="../../index.html"
                       class="hover:text-blue-600">

                        Home

                    </a>

                    <a href="about.html"
                       class="hover:text-blue-600">

                        About

                    </a>

                    <a href="contact.html"
                       class="text-blue-600 font-bold">

                        Contact

                    </a>

                    <a href="signup.html"
                       class="hover:text-blue-600">

                        Sign Up

                    </a>

                    <a href="signin.html"
                       class="hover:text-blue-600">

                        Sign In

                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- ================= HERO ================= -->

    <section class="bg-blue-100 text-center py-14">

        <h1 class="text-4xl font-bold mb-3">

            Contact Us

        </h1>

        <p class="text-gray-600">

            We would love to hear from you.

        </p>

    </section>



    <!-- ================= CONTACT CARDS ================= -->

    <section class="max-w-6xl mx-auto px-4 py-12">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">


            <div class="bg-white shadow rounded-lg p-6 text-center">

                <div class="text-4xl mb-3">📧</div>

                <h3 class="font-bold text-xl">

                    Email

                </h3>

                <p class="text-gray-600">

                    fatima@gmail.com

                </p>

            </div>


            <div class="bg-white shadow rounded-lg p-6 text-center">

                <div class="text-4xl mb-3">📞</div>

                <h3 class="font-bold text-xl">

                    Phone

                </h3>

                <p class="text-gray-600">

                    0300-1234567

                </p>

            </div>


            <div class="bg-white shadow rounded-lg p-6 text-center">

                <div class="text-4xl mb-3">📍</div>

                <h3 class="font-bold text-xl">

                    Address

                </h3>

                <p class="text-gray-600">

                    Lahore, Pakistan

                </p>

            </div>

        </div>

    </section>




    <div class="max-w-2xl mx-auto px-4">

        <div class="p-4 mb-6 text-blue-800 bg-blue-100 rounded-lg">

            Please fill all required fields correctly.

        </div>

    </div>




    <section class="max-w-2xl mx-auto px-4 pb-14">

        <div class="bg-white shadow-lg rounded-lg p-8">


            <h2 class="text-2xl font-bold text-center mb-8">

                Send Us a Message

            </h2>


            <form action="https://formspree.io/f/xoevvzgg"
      method="POST">


                <div class="mb-5">

                    <label class="block font-medium mb-2">

                        Name

                    </label>

                    <input type="text"
                           name="name"
                           required
                           minlength="3"
                           placeholder="Enter your name"
                           class="w-full p-3 border border-gray-300 rounded-lg">

                </div>



                

                <div class="mb-5">

                    <label class="block font-medium mb-2">

                        Email

                    </label>

                    <input type="email"
                           name="email"
                           required
                           placeholder="Enter your email"
                           class="w-full p-3 border border-gray-300 rounded-lg">

                </div>



               
                <div class="mb-5">

                    <label class="block font-medium mb-2">

                        Phone

                    </label>

                    <input type="tel"
                           name="phone"
                           pattern="[0-9]{11}"
                           placeholder="03001234567"
                           class="w-full p-3 border border-gray-300 rounded-lg">

                </div>



            

                <div class="mb-5">

                    <label class="block font-medium mb-2">

                        Subject

                    </label>

                    <select name="subject"
                            required
                            class="w-full p-3 border border-gray-300 rounded-lg">

                        <option value="">

                            Select Subject

                        </option>

                        <option>

                            General Question

                        </option>

                        <option>

                            Technical Support

                        </option>

                        <option>

                            Feedback

                        </option>

                    </select>

                </div>



                

                <div class="mb-5">

                    <label class="block font-medium mb-2">

                        Message

                    </label>

                    <textarea name="message"
                              rows="5"
                              required
                              minlength="10"
                              placeholder="Write your message"
                              class="w-full p-3 border border-gray-300 rounded-lg"></textarea>

                </div>



               

                <div class="flex items-center mb-6">

                    <input type="checkbox"
                           required
                           class="mr-2">

                    <label class="text-sm">

                        I confirm that the information is correct.

                    </label>

                </div>



               

                <button type="submit"
                        class="w-full bg-blue-600 text-white
                               p-3 rounded-lg hover:bg-blue-700">

                    Send Message

                </button>


            </form>

        </div>

    </section>





    <footer class="bg-gray-900 text-white text-center py-8">

        <h3 class="text-xl font-bold">

            WebNest

        </h3>

        <p class="text-gray-400 mt-2">

            WebNest

        </p>

    </footer>




    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>


</body>

</html>
